<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Implantação NW Software</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: faixa azul-marinho NW, abas fixas (visão geral, cronograma, agenda, fichas, key users), conteúdo em cartões. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef2f6; --ink:#14324e; --muted:#566574; --line:#dbe2ea;
  --navy:#14324e; --on-navy:#ffffff;
  --accent:#0f6aa8; --accent-fill:#5dafe1;
  --done:#8dbd2f; --doing:#f5a90f; --todo:#c4cdd6; --block:#7b8794;
  --done-ink:#3f5f0a; --doing-ink:#7a4b00; --focus:#0f6aa8;
  --pri-bg:#14324e; --pri-fg:#ffffff; --danger:#b3261e; --sched:#0f6aa8;
  --f-head:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Aptos","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a29; --surface:#132538; --surface2:#1a3148; --ink:#e7eef5; --muted:#9db0c2; --line:#26425c;
    --accent:#7cc4ee; --accent-fill:#5dafe1; --todo:#3a5169; --block:#8b9aa9;
    --done-ink:#b9e06a; --doing-ink:#fcd27a; --focus:#7cc4ee; --pri-bg:#5dafe1; --pri-fg:#0c1a29;
    --danger:#ff8a80; --sched:#7cc4ee; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a29; --surface:#132538; --surface2:#1a3148; --ink:#e7eef5; --muted:#9db0c2; --line:#26425c;
  --accent:#7cc4ee; --accent-fill:#5dafe1; --todo:#3a5169; --block:#8b9aa9;
  --done-ink:#b9e06a; --doing-ink:#fcd27a; --focus:#7cc4ee; --pri-bg:#5dafe1; --pri-fg:#0c1a29;
  --danger:#ff8a80; --sched:#7cc4ee; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

.top{background:var(--navy);color:var(--on-navy)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;padding-block:22px 20px}
.top img{height:44px;width:auto;display:block}
.top .ttl{min-width:0}
.top .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.top h1{font-size:clamp(22px,4vw,32px);font-weight:700;margin-top:2px}
.top .sub{opacity:.85;margin-top:2px}
.stripe{display:flex;height:5px}
.stripe i{flex:1}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;white-space:nowrap;font-family:var(--f-head);font-weight:500;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-fill);font-weight:600}
.tab .cnt{background:var(--doing);color:#14324e;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}

main{padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
section>h2{font-size:18px;font-weight:600;margin-bottom:12px}
.hint{color:var(--muted);font-size:13px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.bar-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.row-gap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.pct-card{display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center;text-align:center}
.ring{position:relative;width:176px;height:176px}
.ring svg{display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--f-head);font-weight:700;font-size:40px;line-height:1}
.ring .lab{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:10px;border-radius:5px;background:var(--todo);overflow:hidden;display:flex;gap:2px;width:100%}
.bar b{display:block;height:100%}
.bar .d{background:var(--done)} .bar .g{background:var(--doing)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-head);font-weight:600;font-size:26px;line-height:1.2;margin-top:2px}
.kpi .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.kpi.wide{grid-column:span 2}
.next{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.next .t{font-weight:600}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.hb .n{overflow-wrap:anywhere}
.hb .t{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent-fill);border-radius:0 6px 6px 0}
.hb .p{text-align:right}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.empty{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center;border:1px dashed var(--line);border-radius:8px}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{font-family:var(--f-head);font-weight:600;font-size:12px;text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.grp td{background:var(--surface2);font-family:var(--f-head);font-weight:600;font-size:13px}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface2)}
.mail{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.mail code{font-family:inherit;font-size:13px;user-select:all;overflow-wrap:anywhere}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer}
.cp:hover{background:var(--surface2)}
.mini{display:flex;align-items:center;gap:8px;min-width:120px}
.mini .t{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.mini .t i{display:block;height:100%;background:var(--done)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.g{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.g.off{opacity:.8}
.gh{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
.gh .sq{width:14px;height:14px;border-radius:3px}
.gh .nm{font-family:var(--f-head);font-weight:600;font-size:16px}
.gh .who{font-size:13px;color:var(--muted)}
.gh .r{display:flex;align-items:center;gap:12px}
.gh .pc{font-family:var(--f-head);font-weight:600;font-size:18px;min-width:48px;text-align:right}
.gh .chev{transition:transform .15s}
.g.open .chev{transform:rotate(90deg)}
.gb{display:none;border-top:1px solid var(--line);padding:6px 16px 16px}
.g.open .gb{display:block}
.gprog{padding:0 16px 14px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge.todo,.badge.cancelado{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.badge.doing,.badge.registrar{background:color-mix(in srgb,var(--doing) 22%,transparent);color:var(--doing-ink)}
.badge.done,.badge.realizado{background:color-mix(in srgb,var(--done) 24%,transparent);color:var(--done-ink)}
.badge.agendado{background:color-mix(in srgb,var(--accent-fill) 24%,transparent);color:var(--accent)}
.badge.blocked{background:var(--surface2);color:var(--block);border-color:var(--block)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.etool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:10px 12px;background:var(--surface2);border-radius:8px}
.sec{margin-top:16px}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sh .sn{font-family:var(--f-head);font-weight:600;font-size:14px;flex:1 1 240px;min-width:0}
.sh .sw{font-size:12px;color:var(--muted)}
.sh .sp{font-size:13px;font-weight:600;min-width:40px;text-align:right}
.sh .ed{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.nb{font-size:12px;margin-left:8px;color:var(--muted)}
.cr-unused{display:grid;grid-template-columns:1fr 1.3fr 1fr auto;gap:8px;margin-bottom:8px}
.cr.lk{grid-template-columns:1fr auto;align-items:center;padding:6px 10px;background:var(--surface2);border-radius:8px}
.cr input[type=text]{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.notes{margin:8px 0 4px;padding:12px;background:var(--surface2);border-radius:8px;display:flex;flex-direction:column;gap:10px}
.notes textarea{width:100%;min-height:72px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ni{padding-bottom:10px;border-bottom:1px solid var(--line)} .ni:last-of-type{border-bottom:0;padding-bottom:0}
.ni .nh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.it{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.it .tx{min-width:0;overflow-wrap:anywhere}
.it .tx .ed{font-size:12px;margin-left:8px;color:var(--muted)}
.it .mt{font-size:12px;color:var(--muted);text-align:right}
.it.done .tx{color:var(--muted)}
.st{width:28px;height:28px;border-radius:50%;border:2px solid var(--block);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.st svg{display:block}
.st.doing{border-color:var(--doing)}
.st.done{border-color:var(--done);background:var(--done)}
.st:disabled{cursor:not-allowed;opacity:.5}

.ev{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.ev .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--done)}
.ev .dot.doing{background:var(--doing)}
.ev .dot.ficha{background:var(--accent-fill)}
.ev .w{font-size:12px;color:var(--muted);white-space:nowrap}
.ev .x{min-width:0;overflow-wrap:anywhere}
.ev .y{font-size:12px;color:var(--muted)}

/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.cal .dh{background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:6px 0;text-transform:uppercase;letter-spacing:.05em}
.cell{min-height:92px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cell:nth-child(7n+1){border-left:0}
.cell.out{background:var(--bg);color:var(--muted)}
.cell.sel{outline:2px solid var(--accent-fill);outline-offset:-2px}
.cell .dn{font-size:12px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--pri-bg);color:var(--pri-fg)}
.chipe{font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;border-left:3px solid}
.chipe.agendado{background:color-mix(in srgb,var(--accent-fill) 22%,transparent);border-color:var(--accent-fill)}
.chipe.realizado{background:color-mix(in srgb,var(--done) 24%,transparent);border-color:var(--done)}
.chipe.registrar{background:color-mix(in srgb,var(--doing) 24%,transparent);border-color:var(--doing)}
.chipe.cancelado{background:var(--surface2);border-color:var(--block);text-decoration:line-through;color:var(--muted)}
.more{font-size:11px;color:var(--muted)}
.dayp .evr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.dayp .evr .tm{font-weight:600;min-width:92px}
.dayp .evr .tt{min-width:0;overflow-wrap:anywhere}
.dayp .evr .sub{font-size:12px;color:var(--muted)}
.legend-row{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}

/* Modal */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;background:rgba(8,20,32,.55);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#modal.on{display:flex}
.md{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:680px;margin:auto 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px}
.mh .x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.md.wide{max-width:860px}
.mb{padding:16px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.mfoot .sp{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 2px;flex-wrap:wrap}
.mtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.mtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.mpane{display:none;flex-direction:column;gap:12px}.mpane.on{display:flex}
.hdr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hdr .f label{font-size:12px}
.lrow{display:grid;gap:8px;align-items:end;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lrow.h{grid-template-columns:repeat(4,minmax(0,1fr)) 64px 28px}
.lrow.d{grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1.1fr) 28px}
@media (max-width:640px){.lrow.h,.lrow.d{grid-template-columns:repeat(2,minmax(0,1fr))}.lrow .x2{justify-self:end}}
.lrow .tot{align-self:center;font-variant-numeric:tabular-nums;font-weight:600}
.lrow .x2{background:none;border:0;color:var(--danger);cursor:pointer;padding:6px;font-size:18px;line-height:1}
.sumline{display:flex;justify-content:flex-end;gap:8px;font-weight:600;font-variant-numeric:tabular-nums}
.dl.wide{grid-template-columns:150px minmax(0,1fr)}
.tb2{width:100%;border-collapse:collapse;font-size:14px}.tb2 th,.tb2 td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.tb2 th{color:var(--muted);font-weight:500}.tb2 td.r,.tb2 th.r{text-align:right}
.fico{display:inline-grid;place-items:center;min-width:40px;height:28px;padding:0 6px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;flex:none}
.fcell{display:flex;gap:10px;align-items:center;min-width:0}.fcell b{overflow-wrap:anywhere}
.fact{white-space:nowrap;text-align:right}.fact .btn{text-decoration:none;display:inline-block}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.f>.lb{font-size:13px;font-weight:600}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f select,.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.chk{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.chk label{display:flex;gap:6px;align-items:center;font-weight:400}
.itbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.itbox label{display:flex;gap:8px;align-items:flex-start;font-weight:400}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;font-size:14px}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.sub-h{font-family:var(--f-head);font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.foot{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{padding:2px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);z-index:40}
#toast.on{opacity:1}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .kpi.wide{grid-column:auto}
  .it{grid-template-columns:32px minmax(0,1fr)}
  .it .mt{grid-column:2;text-align:left}
  .gh{grid-template-columns:auto minmax(0,1fr)}
  .gh .r{grid-column:2;justify-content:space-between}
  .cell{min-height:58px;padding:3px}

function plan(){
  const cfg=ST.cfg, hid=new Set(cfg.hidden||[]), hs=new Set(cfg.hiddenSec||[]), rn=cfg.rename||{}, ar=cfg.areas||{};
  const arr=(o)=>Object.entries(o).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.ord||0)-(b.ord||0)||a.id.localeCompare(b.id));
  const gs=BASE.map(g=>({id:g.id,name:rn[g.id]||g.name,short:rn[g.id]||g.short,color:g.color,deps:g.deps,custom:false,
    sections:g.sections.filter(s=>!hs.has(s.id)).map(s=>({id:s.id,name:rn[s.id]||s.name,areas:ar[s.id]||s.areas,custom:false,
      items:s.items.filter(i=>!hid.has(i.id)).map(i=>({id:i.id,t:rn[i.id]||i.t,custom:false}))}))}));
  arr(ST.plan_g).forEach((g,i)=>gs.push({id:g.id,name:rn[g.id]||g.name,short:rn[g.id]||g.name,color:g.color||COLORS[(i+3)%COLORS.length],deps:["instalacao"],custom:true,sections:[]}));
  const gm=Object.fromEntries(gs.map(g=>[g.id,g]));

  const order=cfg.gorder||[];

}

    a.contacts.forEach(c=>{ if(reg[c.cid]) reg[c.cid].areas.push(a.k); });
    a.short=(a.contacts[0]&&plainName(a.contacts[0].name))||a.label; });
  list.sort((a,b)=>GROUPS.indexOf(a.grp)-GROUPS.indexOf(b.grp));
  REG=reg;
  return list;
}

/* ---------- cálculo ---------- */
function statusOf(d,g,t){ return t && d===t ? "done" : (d+g>0 ? "doing" : "todo"); }
function compute(){
  const off=offSet(), P=plan(), secMap={};
  const R = {gs:[],by:{},tot:0,done:0,doing:0,mods:0,modsDone:0};
  for(const g of P){
    const G = {g,on:!off.has(g.id),secs:[],total:0,done:0,doing:0}; secMap[g.id]={g:g.name,sec:g.name};
    for(const s of g.sections){
      const X = {s,total:s.items.length,done:0,doing:0}; secMap[s.id]={g:g.name,sec:s.name};
      for(const it of s.items){ const st=pg(it.id).s; if(st==="done")X.done++; else if(st==="doing")X.doing++; secMap[it.id]={g:g.name,sec:s.name+" › "+it.t}; }
      X.pct = X.total ? X.done/X.total : 0; X.status = statusOf(X.done,X.doing,X.total);
      G.secs.push(X); G.total+=X.total; G.done+=X.done; G.doing+=X.doing;
    }
    G.pct = G.total ? G.done/G.total : 0; G.status = statusOf(G.done,G.doing,G.total);
    R.gs.push(G); R.by[g.id]=G;
    if(G.on){ R.tot+=G.total; R.done+=G.done; R.doing+=G.doing; R.mods++; if(G.status==="done") R.modsDone++; }
  }
  for(const G of R.gs){
    G.depsUnmet = G.on && G.g.deps.some(d=>{ const D=R.by[d]; return D && D.on && D.status!=="done"; });
    G.unlocked = (ST.cfg.unlocked||[]).includes(G.g.id);
    G.blocked = G.depsUnmet && !G.unlocked;
    G.shown = (G.blocked && G.status==="todo") ? "blocked" : G.status;
  }
  R.pct = R.tot ? R.done/R.tot : 0;
  R.todo = R.tot-R.done-R.doing;
  R.rec = null;
  outer: for(const G of R.gs){
    if(!G.on || G.blocked || G.status==="done") continue;
    for(const X of G.secs){ if(X.status!=="done"){
      const it = X.s.items.find(i=>pg(i.id).s!=="done");
      R.rec = {G,X,it}; break outer; } }
  }
  const ev = [];
  for(const G of R.gs){ if(!G.on) continue; for(const X of G.secs) for(const it of X.s.items){
    const p=pg(it.id); if(p.at) ev.push({kind:"prog",t:it.t,s:p.s,by:p.by,at:p.at,g:G.g.name,sec:X.s.name}); } }
  Object.entries(ST.fichas).forEach(([id,f])=>{ if(f.at) ev.push({kind:"ficha",id,no:f.no,tipo:f.tipo,by:f.by,at:f.at,date:f.date}); });
  Object.entries(ST.notas).forEach(([id,n])=>{ if(n.at&&secMap[n.s]) ev.push({kind:"nota",text:n.text,by:n.by,at:n.at,g:secMap[n.s].g,sec:secMap[n.s].sec}); });
  ev.sort((a,b)=>b.at.localeCompare(a.at));
  R.ev = ev;
  // agenda
  const now=new Date();
  R.agenda = Object.entries(ST.agenda).map(([id,e])=>Object.assign({id,state:evState(e,now)},e)).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
  R.pendFicha = R.agenda.filter(e=>e.state==="registrar").length;
  R.next = R.agenda.find(e=>e.state==="agendado") || null;
  R.fichas = Object.entries(ST.fichas).map(([id,f])=>Object.assign({id},f)).sort((a,b)=>(b.date+(b.start||"")).localeCompare(a.date+(a.start||"")));
  R.fichaMins = R.fichas.reduce((a,f)=>a+fichaMin(f),0);
  return R;
}
function evState(e,now){
  if(e.status==="cancelado") return "cancelado";
  if(e.fichaId || e.status==="realizado") return "realizado";
  return toDate(e.date,e.end||e.start||"23:59") < now ? "registrar" : "agendado";
}
function gName(gid){ const G=M.by[gid]; return G?G.g.name:""; }
function sName(gid,sid){ const G=M.by[gid]; if(!G) return ""; const X=G.secs.find(x=>x.s.id===sid); return X?X.s.name:""; }
function gsLabel(gid,sid){ const a=gName(gid); if(!a) return "Geral"; const b=sName(gid,sid); return b?a+" › "+b:a; }

/* ---------- gráficos ---------- */
function ringSvg(p,size,sw,c1){
  const r=(size-sw)/2, C=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--todo)" stroke-width="${sw}"/>
    ${p>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c1}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/>`:""}</svg>`;
}
function donutSvg(parts,size,sw){
  const r=(size-sw)/2, C=2*Math.PI*r, tot=parts.reduce((a,b)=>a+b.v,0);
  let o=0, out=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--todo)" stroke-width="${sw}"/>`;
  const nz = parts.filter(p=>p.v>0).length;
  if(tot>0) for(const p of parts){ if(!p.v) continue;
    const len=C*p.v/tot, gap=nz>1?2:0;
    out+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(len-gap,0.5)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(p.n)}: ${p.v}</title></circle>`;
    o+=len; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Distribuição das atividades">${out}</svg>`;
}
function evolution(){
  const done=[]; for(const G of M.gs){ if(!G.on) continue; for(const X of G.secs) for(const it of X.s.items){ const p=pg(it.id); if(p.s==="done"&&p.at) done.push(p.at); } }
  if(!done.length||!M.tot) return `<div class="empty">A curva aparece aqui quando a primeira atividade for concluída.</div>`;
  const day=(iso)=>{ const d=new Date(iso); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); };
  const counts=new Map(); done.forEach(a=>{ const k=day(a); counts.set(k,(counts.get(k)||0)+1); });
  const days=[...counts.keys()].sort((a,b)=>a-b);
  const D=86400000, td=day(new Date().toISOString());
  const x0=days[0]-D, x1=Math.max(td,days[days.length-1]);
  let cum=0; const pts=[[x0,0]];
  days.forEach(k=>{ cum+=counts.get(k); pts.push([k,cum/M.tot]); });
  if(x1>days[days.length-1]) pts.push([x1,cum/M.tot]);
  const ymax=Math.min(1,Math.max(0.1,Math.ceil(cum/M.tot*12)/10));
  const W=520,H=210,l=40,r=18,t=14,b=30, span=Math.max(x1-x0,D);
  const X=v=>l+(v-x0)/span*(W-l-r), Y=v=>t+(1-v/ymax)*(H-t-b);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const area=line+` L${X(pts[pts.length-1][0]).toFixed(1)} ${Y(0)} L${X(x0)} ${Y(0)} Z`;
  const ticks=[0,ymax/2,ymax].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${pc(v)}</text>`).join("");
  const lp=pts[pts.length-1];
  const dl=(ms)=>new Date(ms).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
  const hov=pts.slice(1).map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="9" fill="transparent"><title>${dl(p[0])}: ${pc(p[1])}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução do percentual concluído ao longo do tempo, atualmente ${pc(M.pct)}">
    ${ticks}<path d="${area}" fill="var(--accent-fill)" opacity=".22"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${X(lp[0])-8}" y="${Y(lp[1])-10}" text-anchor="end" style="fill:var(--ink);font-weight:600;font-size:12px">${pc(lp[1])}</text>
    <text x="${l}" y="${H-8}">${dl(days[0])}</text><text x="${W-r}" y="${H-8}" text-anchor="end">${dl(x1)}</text>${hov}</svg>`;
}

      <div class="kpi"><div class="k">Tempo restante</div><div class="v num">${eta}</div><div class="s">${MIN_PER_ITEM} min por atividade</div></div>

async function writeRaw(a,raw){ if(JSON.stringify(raw)===JSON.stringify(a.raw)) return; await put("equipe",a.k,Object.assign({},ST.equipe[a.k]||{},{contacts:raw},ST.equipe[a.k]?{}:{del:false})); }
async function savePerson(cid,f,keys,newArea){
  const cur=cid?REG[cid]:null; const id=cid||newId();
  const existing=keys.slice(); let newKey=null;
  if(newArea){ newKey=newId(); }
  const all=existing.concat(newKey?[newKey]:[]);
  const home=(cur&&all.includes(cur.homeK))?cur.homeK:all[0];
  const owned={cid:id,name:f.name,email:f.email,phone:f.phone};
  for(const a of AL){
    const raw=a.raw.slice(); const idx=raw.findIndex(c=>c.cid===id||c.link===id);
    const want=all.includes(a.k)?(a.k===home?owned:{link:id}):null;
    if(idx>=0){ if(want) raw[idx]=want; else raw.splice(idx,1); } else if(want) raw.push(want);
    await writeRaw(a,raw);
  }
  if(newKey) await put("equipe",newKey,{label:newArea,grp:"Outros",contacts:[newKey===home?owned:{link:id}],ord:nextOrd("equipe"),del:false});
}

const noteList=(sid)=>Object.entries(ST.notas).filter(([,n])=>n.s===sid).map(([id,n])=>Object.assign({id},n)).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
const noteCount=(sid)=>noteList(sid).length;
function notePanel(sid){
  if(!openC.has(sid)) return "";

function rPlan(){
  const seg=[["all","Todas"],["todo","Pendentes"],["doing","Em andamento"],["done","Concluídas"]]
    .map(([k,l])=>`<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
  const hidCount=(ST.cfg.hidden||[]).length+(ST.cfg.hiddenSec||[]).length;
  let html=`<div class="bar-tools"><h2 style="margin:0">Cronograma da implantação</h2><div class="seg" role="group" aria-label="Filtrar atividades">${seg}</div></div>
    <div class="bar-tools"><span class="hint">${editing?"Modo de personalização: edite gestões, etapas e atividades deste cliente.":"Clique no círculo de uma atividade para alternar: não iniciada, em andamento, concluída."}</span>
      <span class="row-gap">${isAdmin?`<button class="btn ${editing?"pri":""}" data-act="edit">${editing?"Concluir personalização":"Personalizar cronograma"}</button>`:""}${editing?`<button class="btn" data-act="g-new">+ Nova gestão</button>${hidCount?`<button class="btn" data-act="restore">Restaurar removidas (${hidCount})</button>`:""}`:""}<button class="chip" data-act="expand">Expandir tudo</button><button class="chip" data-act="collapse">Recolher tudo</button></span></div>`;
  const ids=M.gs.map(G=>G.g.id);

    if(!G.on){
      html+=`<div class="g off"><div class="gh" style="cursor:default"><span class="sq" style="background:var(--block)"></span><div><div class="nm">${esc(g.name)}</div><div class="who">Fora do escopo · não contratado. Não entra nos percentuais.</div></div><div class="r">${isAdmin?`<button class="btn sm" data-act="scope" data-g="${esc(g.id)}">Incluir no escopo</button>`:""}</div></div></div>`;
      continue;
    }
    let body="";
    if(editing){
      const i=ids.indexOf(g.id);
      body+=`<div class="etool"><button class="btn sm" data-act="g-ren" data-g="${esc(g.id)}">Renomear gestão</button><button class="btn sm" data-act="g-up" data-g="${esc(g.id)}" ${i===0?"disabled":""}>↑ Subir</button><button class="btn sm" data-act="g-down" data-g="${esc(g.id)}" ${i===ids.length-1?"disabled":""}>↓ Descer</button><button class="btn sm" data-act="s-new" data-g="${esc(g.id)}">+ Etapa</button><button class="btn sm" data-act="scope" data-g="${esc(g.id)}">Remover do escopo</button>${g.custom?`<button class="btn sm danger" data-act="g-del" data-g="${esc(g.id)}">Excluir gestão</button>`:""}</div>`;
    }
    if(G.depsUnmet){ const dn=g.deps.map(d=>M.by[d]?M.by[d].g.name:"").filter(Boolean).join(", ");
      body+=`<p class="note">${G.unlocked?"Liberada manualmente, mesmo sem concluir":"Bloqueada: depende da conclusão de"} ${esc(dn)}.${(!G.unlocked&&!isAdmin)?" As atividades ficam liberadas quando a dependência for concluída ou quando a equipe NW liberar.":""} ${isAdmin?`<button class="btn sm" data-act="unlock" data-g="${esc(g.id)}">${G.unlocked?"Voltar a bloquear":"Liberar agora"}</button>`:""}</p>`; }
    body+=`<div style="margin-top:10px"><button class="btn sm" data-act="note-toggle" data-s="${esc(g.id)}" aria-expanded="${openC.has(g.id)}">Comentários da gestão${noteCount(g.id)?" ("+noteCount(g.id)+")":""}</button>${notePanel(g.id)}</div>`;

      body+=`<div class="sec" id="sec-${esc(s.id)}"><div class="sh"><div class="sn">${esc(s.name)}</div><span class="sw">${s.areas.length?"Resp.: "+s.areas.map(k=>AREA[k]?esc(AREA[k].short):"").join(", "):""}</span><span class="badge ${sh}">${LBL[sh]}</span><span class="sp num">${pc(X.pct)}</span><button class="btn sm" data-act="note-toggle" data-s="${esc(s.id)}" aria-expanded="${openC.has(s.id)}">Comentários${noteCount(s.id)?" ("+noteCount(s.id)+")":""}</button>

      }
      if(editing && !its.length) body+=`<p class="note">Etapa sem atividades.</p>`;
      body+=`</div>`;
    }
    if(!body.includes('class="sec"')) body+=`<p class="note">Nenhuma atividade neste filtro.</p>`;
    html+=`<div class="g ${isOpen?"open":""}" id="g-${esc(g.id)}"><button class="gh" data-act="toggle" data-g="${esc(g.id)}" aria-expanded="${isOpen}">

      <div class="r"><span class="badge ${G.shown}">${G.shown==="blocked"?"🔒 ":""}${LBL[G.shown]}</span><span class="pc num">${pc(G.pct)}</span><svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div></button>
      <div class="gprog"><div class="bar"><b class="d" style="width:${G.pct*100}%"></b><b class="g" style="width:${G.total?G.doing/G.total*100:0}%"></b></div></div>
      <div class="gb">${body}</div></div>`;
  }
  $("#s-plan").innerHTML=html;
}

/* ---------- agenda ---------- */
function rCal(){
  const first=new Date(cal.y,cal.m,1), start=new Date(cal.y,cal.m,1-first.getDay());
  const total=Math.ceil((first.getDay()+new Date(cal.y,cal.m+1,0).getDate())/7)*7;
  const byDay={}; M.agenda.forEach(e=>{ (byDay[e.date]=byDay[e.date]||[]).push(e); });
  const tdy=ds(new Date());
  const title=new Date(cal.y,cal.m,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  let grid=["dom","seg","ter","qua","qui","sex","sáb"].map(d=>`<div class="dh">${d}</div>`).join("");
  for(let i=0;i<total;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), k=ds(d), evs=byDay[k]||[];
    const chips=evs.slice(0,2).map(e=>`<span class="chipe ${e.state}">${esc(e.start||"")} ${esc(e.title)}</span>`).join("")+(evs.length>2?`<span class="more">+${evs.length-2}</span>`:"");
    grid+=`<button class="cell ${d.getMonth()!==cal.m?"out":""} ${k===tdy?"today":""} ${k===cal.day?"sel":""}" data-act="day" data-d="${k}" aria-label="${d.getDate()} de ${d.toLocaleDateString("pt-BR",{month:"long"})}, ${evs.length} agendamento${evs.length===1?"":"s"}"><span class="dn num">${d.getDate()}</span>${chips}</button>`;
  }
  const legend=Object.keys(ELBL).map(k=>`<span><span class="badge ${k}">${ELBL[k]}</span></span>`).join("");
  let main="";
  if(cal.view==="mes"){
    main=`<div class="cal">${grid}</div>`;
    if(cal.day){
      const evs=byDay[cal.day]||[];
      const dt=toDate(cal.day).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
      main+=`<div class="card dayp" style="margin-top:12px"><div class="bar-tools" style="margin-bottom:4px"><h3 style="margin:0">${esc(up(dt))}</h3>${isAdmin?`<button class="btn sm pri" data-act="ev-new" data-d="${cal.day}">+ Agendar neste dia</button>`:""}</div>${evs.length?evs.map(evRow).join(""):`<div class="hint" style="padding:8px 0">Nenhum agendamento neste dia.</div>`}</div>`;
    }
  } else {
    const nowS=new Date(); const fut=M.agenda.filter(e=>e.state==="agendado"), pend=M.agenda.filter(e=>e.state==="registrar"), past=M.agenda.filter(e=>e.state==="realizado"||e.state==="cancelado").reverse();
    const blk=(t,l)=>`<div class="card dayp" style="margin-bottom:12px"><h3>${t} <span class="hint">(${l.length})</span></h3>${l.length?l.map(e=>evRow(e,true)).join(""):`<div class="hint">Nada por aqui.</div>`}</div>`;
    main=blk("Ficha pendente (já aconteceram)",pend)+blk("Próximos agendamentos",fut)+blk("Anteriores",past);
  }
  $("#s-cal").innerHTML=`<div class="bar-tools"><h2 style="margin:0">Agenda</h2><span class="row-gap">
      <span class="seg"><button class="chip" data-act="cview" data-v="mes" aria-pressed="${cal.view==="mes"}">Mês</button><button class="chip" data-act="cview" data-v="lista" aria-pressed="${cal.view==="lista"}">Lista</button></span>
      ${isAdmin?`<button class="btn pri" data-act="ev-new" data-d="${cal.day||tdy}">+ Novo agendamento</button>`:""}</span></div>
    ${cal.view==="mes"?`<div class="bar-tools"><span class="row-gap"><button class="btn" data-act="cprev" aria-label="Mês anterior">‹</button><b style="min-width:150px;text-align:center;font-family:var(--f-head)">${esc(up(title))}</b><button class="btn" data-act="cnext" aria-label="Próximo mês">›</button><button class="btn" data-act="ctoday">Hoje</button></span><span class="legend-row">${legend}</span></div>`:`<div class="legend-row" style="margin-bottom:12px">${legend}</div>`}
    ${main}`;
}
function evRow(e,withDate){
  const sub=[e.tipo,e.mod,gsLabel(e.gid,e.sid)].filter(Boolean).join(" · ");
  return `<div class="evr"><div class="tm num">${withDate?fmtD(e.date)+"<br>":""}${esc(e.start||"")}${e.end?"–"+esc(e.end):""}</div><div class="tt"><b>${esc(e.title)}</b><div class="sub">${esc(sub)}</div></div><div class="row-gap"><span class="badge ${e.state}">${ELBL[e.state]}</span><button class="btn sm" data-act="ev-open" data-id="${esc(e.id)}">Abrir</button></div></div>`;
}

function render(){
  AL=effAreas(); AREA=Object.fromEntries(AL.map(a=>[a.k,a]));
  const ae=document.activeElement, dk=ae&&ae.dataset&&ae.dataset.draft, ss=dk?ae.selectionStart:0, se=dk?ae.selectionEnd:0;
  M=compute();
  if(!openInit){ openInit=true; if(M.rec) open.add(M.rec.G.g.id); }
  rResumo(); rCharts(); rEv(); rUsers(); rPlan(); rCal(); rFichas(); if(typeof rArquivos==="function") rArquivos(); rTabs(); rFoot();

/* ---------- gravação ---------- */
async function put(c,id,data){ if(!db){ ST[c][id]=data; render(); return; } await db.doc(c+"/"+id).set(data); }
async function del(c,id){ if(!db){ delete ST[c][id]; render(); return; } await db.doc(c+"/"+id).delete(); }
async function putCfg(patch){ const next=Object.assign({},ST.cfg,patch); if(!db){ ST.cfg=next; render(); return; } await db.doc("plan/cfg").set(next); }
const guard=async(fn,msg)=>{ try{ await fn(); return true; }catch(e){ if(e&&e.api){ if(e.status===401){ location.reload(); return false; } toast(e.message); return false; } toast(msg||"Sem permissão para salvar. Peça acesso de editor ao consultor NW."); return false; } };
async function setStatus(id,next){
  if(pending.has(id)) return;
  const rec=next==="todo"?null:{s:next,by:uid,at:new Date().toISOString()};
  if(!db){ if(!rec) delete ST.progress[id]; else ST.progress[id]=rec; render(); return; }
  pending.add(id);
  try{ if(!rec) await db.doc("progress/"+id).delete(); else await db.doc("progress/"+id).set(rec); }
  catch(e){ toast("Sem permissão para registrar. Peça acesso de colaborador ao consultor NW."); }
  finally{ pending.delete(id); }
}

  $("#modal").innerHTML=`<div class="md${MD.wide?" wide":""}" role="dialog" aria-modal="true" aria-labelledby="mdt"><div class="mh"><h3 id="mdt">${esc(title)}</h3><button type="button" class="x" data-act="m-close" aria-label="Fechar">×</button></div><form id="mf" autocomplete="off"><div class="mb">${body}</div>${foot}</form></div>`;

  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

async function pdfFicha(id){

      if(o.bg){ doc.setFillColor(...o.bg); doc.rect(MG,y-9,CW,hh,"F"); }
      ls.forEach((l,i)=>{ l.forEach((t,k)=>txt(t,cols[i].r?xs[i]+cols[i].w*CW-4:xs[i]+4,y+k*11,{s:9,b:o.b,c:o.c||NAVY,a:cols[i].r?"right":undefined})); });
      y+=hh; doc.setDrawColor(...LINE); doc.setLineWidth(.5); doc.line(MG,y-8,W-MG,y-8); };
    row(cols.map(c=>c.t),{b:1,bg:BG}); rows.forEach(r=>row(r)); if(tot) row(tot,{b:1}); };
  // faixa
  doc.setFillColor(...NAVY); doc.rect(0,0,W,70,"F");
  txt("NW Software",MG,32,{b:1,s:13,c:[255,255,255]}); txt("Ficha de Apropriação "+fichaNo(f.no),MG,54,{s:11,c:[255,255,255]});
  txt(f.status==="rascunho"?"RASCUNHO":"FINALIZADA",W-MG,54,{b:1,s:9,c:[255,255,255],a:"right"});
  y=96; const v=f.veic||{};
  const obs=f.obs!=null&&f.obs!==""?f.obs:[f.pauta,f.pend,f.prox].filter(Boolean).join("\n\n");
  kv([["Cliente",clientName],["Descrição resumida",f.resumo||f.tipo],["Categoria",(f.tipo||"")+" · "+(f.mod||"")],["Ordem de serviço",(f.os||"")+(f.osdesc?" - "+f.osdesc:"")],["Executor",(f.consultor||"")+(f.execcod?" ("+f.execcod+")":"")],["Gestão › Etapa",gsLabel(f.gid,f.sid)]]);
  h2("1 - Horários");
  table([{t:"Data início",w:.26},{t:"Hora início",w:.2},{t:"Data término",w:.26},{t:"Hora término",w:.2},{t:"Total",w:.08,r:1}],fichaH(f).map(h=>[fmtD(h.di),h.hi,fmtD(h.df||h.di),h.hf,hm(lineMin(h))]),["Total","","","",hm(fichaMin(f))]);
  h2("2 - Despesas");

  h2("4 - Informações complementares"); kv([["Veículo",(v.cod||"")+(v.desc?" - "+v.desc:"")],["Transportadora",v.transp||""]]);

document.addEventListener("input",(e)=>{ const k=e.target.dataset&&e.target.dataset.draft; if(k) drafts[k]=e.target.value; });
document.addEventListener("click",async(e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, d=b.dataset;
  switch(a){
    case "tab": setTab(d.t); break;
    case "m-close": closeModal(); break;
    case "cycle": { if(!canWrite) break; const cur=pg(d.id).s||"todo"; await setStatus(d.id,{todo:"doing",doing:"done",done:"todo"}[cur]); const nb=document.querySelector('[data-id="'+d.id+'"]'); if(nb) nb.focus(); break; }
    case "toggle": { open.has(d.g)?open.delete(d.g):open.add(d.g); render(); const nb=document.querySelector('[data-act="toggle"][data-g="'+d.g+'"]'); if(nb) nb.focus(); break; }
    case "filter": filter=d.f; if(filter!=="all") M.gs.forEach(G=>open.add(G.g.id)); render(); break;
    case "expand": M.gs.forEach(G=>open.add(G.g.id)); render(); break;
    case "collapse": open.clear(); render(); break;
    case "goto": setTab("cronograma"); open.add(d.g); render(); { const el=document.getElementById("sec-"+d.s); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); } break;
    case "copy": try{ await navigator.clipboard.writeText(d.v); toast("Copiado"); }catch(err){ toast("Selecione o e-mail e copie com Ctrl+C"); } break;
    case "edit": editing=!editing; if(editing) M.gs.forEach(G=>open.add(G.g.id)); render(); break;
    case "note-toggle": { openC.has(d.s)?openC.delete(d.s):openC.add(d.s); render(); const ta=document.querySelector('textarea[data-draft="'+d.s+'"]'); if(ta) ta.focus(); break; }
    case "note-add": { const ta=document.querySelector('textarea[data-draft="'+d.s+'"]'); const text=ta?ta.value.trim():""; if(!text){ toast("Escreva o comentário antes de publicar."); break; }
      if(await guard(()=>put("notas",newId(),{s:d.s,text,by:uid,at:new Date().toISOString()}),"Sem permissão para comentar. Peça acesso de colaborador ao consultor NW.")){ drafts[d.s]=""; render(); const nt=document.querySelector('textarea[data-draft="'+d.s+'"]'); if(nt) nt.focus(); toast("Comentário publicado"); } break; }
    case "note-del": await guard(()=>del("notas",d.id)); break;
    case "u-edit": openPersonForm(d.c||null); break;
    case "u-area": openAreaEdit(d.k); break;
    case "u-all": document.querySelectorAll('#mf input[name="areas"]').forEach(x=>x.checked=true); break;
    case "u-none": document.querySelectorAll('#mf input[name="areas"]').forEach(x=>x.checked=false); break;
    case "u-del": if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Confirmar remoção"; } else { if(await guard(()=>removePerson(d.c))){ closeModal(); toast("Usuário removido"); } } break;
    case "u-delarea": if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Confirmar remoção"; } else { if(await guard(()=>removeArea(d.k))){ closeModal(); toast("Área removida"); } } break;
    case "u-restore": await guard(async()=>{ for(const [id,o] of Object.entries(ST.equipe)) if(o.del) await put("equipe",id,Object.assign({},o,{del:false})); }); break;
    case "scope": actScope(d.g); break;
    case "unlock": { const u=new Set(ST.cfg.unlocked||[]); u.has(d.g)?u.delete(d.g):u.add(d.g); await guard(()=>putCfg({unlocked:[...u]}),"Somente editores podem liberar uma gestão."); if(!u.has(d.g)) toast("Gestão bloqueada novamente"); else toast("Gestão liberada"); break; }
    case "g-new": actGestNew(); break;
    case "g-ren": actGestRen(d.g); break;
    case "g-up": actGestMove(d.g,-1); break;
    case "g-down": actGestMove(d.g,1); break;
    case "g-del": actGestDel(d.g); break;
    case "s-new": actSecNew(d.g); break;

    case "ev-ficha": openFichaForm(null,M.agenda.find(x=>x.id===d.id)); break;

    case "ev-del": if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Confirmar exclusão"; } else { if(await guard(()=>del("agenda",d.id))){ closeModal(); toast("Agendamento excluído"); } } break;
    case "f-new": openFichaForm(null,null); break;
    case "f-open": openFichaView(d.id); break;
    case "f-csv": csvFicha(d.id); break;
    case "f-pdf": pdfFicha(d.id); break;
    case "f-csv-all": csvFichas(); break;
    case "f-edit": openFichaForm(Object.assign({id:d.id},ST.fichas[d.id])); break;
    case "f-del": if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Confirmar exclusão"; } else { const f=ST.fichas[d.id]; if(await guard(async()=>{ await del("fichas",d.id); if(f&&f.eventId&&ST.agenda[f.eventId]) await put("agenda",f.eventId,Object.assign({},ST.agenda[f.eventId],{status:"agendado",fichaId:null})); })){ closeModal(); toast("Ficha excluída"); } } break;
  }
});

/* ---------- dados compartilhados ---------- */
async function resolveNames(){
  if(!user) return;
  const ids=new Set(); Object.values(ST.progress).forEach(p=>p.by&&ids.add(p.by)); Object.values(ST.fichas).forEach(f=>f.by&&ids.add(f.by)); Object.values(ST.notas).forEach(n=>n.by&&ids.add(n.by)); Object.values(ST.arquivos||{}).concat(Object.values(ST.arquivos_equipe||{})).forEach(n=>n.by&&ids.add(n.by));
  const need=[...ids].filter(i=>!names[i]); if(!need.length) return;
  try{ const ps=await user.profiles(need); let ch=false; for(const i of need){ if(ps[i]){ names[i]=ps[i]; ch=true; } } if(ch) render(); }catch(e){}
}
async function boot(){
  if(MODE==="api") return bootApi();
  const t0=(location.hash||"").slice(1); if(TABS.some(x=>x[0]===t0)) tab=t0;
  render();
  try{ user=await claude.use("user"); }catch(e){ user=null; }
  try{ db=await claude.use("db"); }catch(e){ db=null; }
  if(user){ try{ uid=await user.id(); }catch(e){} try{ isAdmin=!!(await user.canEdit()); }catch(e){} try{ const cw=await user.can("data.write"); canWrite=(cw===null)?true:!!cw; }catch(e){} try{ const me=await user.me(); myName=me&&me.name||""; if(uid==null&&me) uid=me.id; }catch(e){} }
  if(!db){ link="local"; isAdmin=true; render(); return; }
  render();
  const timer=setTimeout(()=>{ if(link==="connecting"){ link="slow"; rFoot(); } },10000);
  const bad=()=>{ link="slow"; clearTimeout(timer); rFoot(); };
  for(const c of COLS){
    db.collection(c).onSnapshot((snap)=>{
      const n={}; snap.docs.forEach(d=>{ const v=d.data(); if(!v) return; if(c==="progress"&&!(v.s==="doing"||v.s==="done")) return; n[d.id]=v; });
      ST[c]=n; if(!snap.metadata.fromCache){ link="live"; clearTimeout(timer); } render(); if(c==="progress"||c==="fichas"||c==="notas"||c==="arquivos"||c==="arquivos_equipe") resolveNames();
    },c==="arquivos_equipe"?()=>{}:bad);
  }
  db.doc("plan/cfg").onSnapshot((snap)=>{ ST.cfg=snap.exists?(snap.data()||{}):{}; render(); },()=>{});
}

const MSGS=[["Invalid login credentials","E-mail ou senha incorretos."],["User already registered","Já existe um usuário com este e-mail."],["Email not confirmed","E-mail ainda não confirmado. No Supabase, desative “Confirm email” (veja o passo a passo)."],["Password should be at least","A senha é curta demais."],["same password","A nova senha precisa ser diferente da atual."],["rate limit","Muitas tentativas. Aguarde alguns minutos e tente de novo."],["Signups not allowed","Cadastro desativado no Supabase. Ative “Allow new users to sign up” (veja o passo a passo)."],["row-level security","Sem permissão para esta ação."],["JWT expired","Sua sessão expirou. Entre novamente."],["Failed to fetch","Sem conexão com o servidor."],["NetworkError","Sem conexão com o servidor."]];
function er(e){ const raw=(e&&(e.message||e.error_description))||String(e); let m=raw; for(const [k,v] of MSGS){ if(raw.toLowerCase().includes(k.toLowerCase())){ m=v; break; } }
  const x=new Error(m); x.api=true; x.status=(e&&Number(e.status))||(/JWT expired|PGRST30[0-9]/.test(raw)?401:0); return x; }
const Q=async(p)=>{ const r=await p; if(r&&r.error) throw er(r.error); return r.data; };
const upd=async(table,col,val,patch)=>{ const d=await Q(SB.from(table).update(patch).eq(col,val).select()); if(!d||!d.length) throw er({message:"row-level security"}); return d[0]; };

const genPw=()=>{ const a="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"; const r=crypto.getRandomValues(new Uint32Array(12)); return Array.from(r,x=>a[x%a.length]).join("")+"7"; };
async function fetchAll(mk){ let out=[],from=0; for(;;){ const d=await Q(mk().range(from,from+999)); out=out.concat(d); if(d.length<1000) break; from+=1000; } return out; }

/* --- camada de dados: mesma interface que a tela já usa (doc/collection/onSnapshot) --- */
function makeDb(cid){
  const cache={}; ["progress","fichas","agenda","plan_g","plan_s","plan_i","notas","equipe","plan"].forEach(c=>cache[c]={});
  const colL={}, cfgL=[]; let loaded=false;
  const snapOf=(c)=>({docs:Object.entries(cache[c]).map(([id,v])=>({id,data:()=>v})),metadata:{fromCache:false}});
  const cfgSnap=()=>({exists:!!cache.plan.cfg,data:()=>cache.plan.cfg||{}});
  const notify=(c)=>{ if(!loaded) return; if(c==="plan"){ cfgL.forEach(f=>f(cfgSnap())); } else (colL[c]||[]).forEach(f=>f(snapOf(c))); };
  async function load(){
    const rows=await fetchAll(()=>SB.from("docs").select("collection,id,data").eq("client_id",cid).order("collection").order("id"));
    for(const c of Object.keys(cache)) cache[c]={};
    rows.forEach(d=>{ if(cache[d.collection]) cache[d.collection][d.id]=d.data; });
    loaded=true; Object.keys(cache).forEach(notify);
  }
  function stream(){
    if(chan) SB.removeChannel(chan); let first=true;
    chan=SB.channel("proj-"+cid)
      .on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"client_id=eq."+cid},(p)=>{
        if(p.eventType==="DELETE"){ const o=p.old||{}; if(o.collection&&cache[o.collection]&&(o.client_id===undefined||o.client_id===cid)){ delete cache[o.collection][o.id]; notify(o.collection); } return; }
        const n=p.new; if(n&&cache[n.collection]){ cache[n.collection][n.id]=n.data; notify(n.collection); } })
      .on("postgres_changes",{event:"*",schema:"public",table:"files",filter:"client_id=eq."+cid},()=>{ loadFiles(); })
      .subscribe((s)=>{ if(s==="SUBSCRIBED"){ if(!first) load().catch(()=>{}); first=false; link="live"; rFoot(); } else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"||s==="CLOSED"){ link="slow"; rFoot(); } });
  }
  return {
    load, stream,
    collection:(c)=>({onSnapshot:(f)=>{ (colL[c]=colL[c]||[]).push(f); if(loaded) f(snapOf(c)); }}),
    doc:(path)=>{ const [c,id]=path.split("/"); return {
      set:async(data)=>{ await Q(SB.from("docs").upsert({client_id:cid,collection:c,id,data},{onConflict:"client_id,collection,id"})); cache[c][id]=data; notify(c); },
      delete:async()=>{ await Q(SB.from("docs").delete().eq("client_id",cid).eq("collection",c).eq("id",id)); delete cache[c][id]; notify(c); },
      onSnapshot:(f)=>{ if(c==="plan"&&id==="cfg"){ cfgL.push(f); if(loaded) f(cfgSnap()); } } }; }
  };
}

          const r=await aux.auth.signUp({email,password:pw,options:{data:{name:patch.name}}}); if(r.error) throw er(r.error);
          const nu=r.data.user; if(!nu||!nu.id||(nu.identities&&!nu.identities.length)) throw er({message:"User already registered"});
          if(!r.data.session) { toast("Usuário criado, mas o Supabase exige confirmação por e-mail. Desative “Confirm email” (veja o passo a passo)."); }
          await upd("profiles","id",nu.id,Object.assign(patch,{active:true,must_change:true}));
          await syncLinks(nu.id,links,[]);
          closeModal(); await rAdmin(); pwModal("Usuário criado","Acesso de <b>"+esc(patch.name)+"</b> ("+esc(email)+") criado. Senha temporária:",pw);
        } else {
          patch.active=fd.get("active")==="1"; await upd("profiles","id",u.id,patch); await syncLinks(u.id,links,u.clientIds||[]);
          closeModal(); toast("Usuário atualizado"); await rAdmin();
        }
      }catch(e){ toast(e.message); } }});
}
function projectForm(c){
  const isNew=!c;
  const consAll=USERS.filter(u=>u.active&&u.role==="consultor");
  const has=(u)=>c&&(u.allClients||u.clientIds.includes(c.id));
  const body=F.txt("name","Nome do cliente",c?c.name:"","required")+F.txt("company","Razão social / observação",c?c.company:"")+
    (isNew?`<div class="f"><span class="lb">Gestões incluídas no escopo</span><div class="cl-list">${DATA.gestoes.map(g=>`<label><input type="checkbox" name="scope" value="${esc(g.id)}" checked> ${esc(g.name)}</label>`).join("")}</div><div class="hint">O cronograma completo é criado para o projeto. Desmarque o que o cliente não vai implantar (dá para mudar depois).</div></div>`:F.sel("active","Situação",[["1","Em implantação"],["0","Encerrado (somente leitura)"]],c.active?"1":"0"))+
    `<div class="f"><span class="lb">Consultores responsáveis por este projeto</span><div class="cl-list">${consAll.map(u=>`<label><input type="checkbox" name="cons" value="${u.id}" ${has(u)?"checked":""} ${u.allClients?"disabled":""}> ${esc(u.name)}${u.allClients?' <span class="hint">(vê todos os projetos)</span>':""}</label>`).join("")||'<span class="hint">Nenhum consultor cadastrado ainda. Crie em Usuários.</span>'}</div></div>`;
  openModal(isNew?"Novo projeto de implantação":"Editar projeto",body,{submit:isNew?"Criar projeto":"Salvar",
    onSubmit:async(fd)=>{
      const b={name:(fd.get("name")||"").trim(),company:(fd.get("company")||"").trim()}; const ids=fd.getAll("cons");
      try{
        if(isNew){ b.created_by=ME.id; const nc=await Q(SB.from("clients").insert(b).select().single());
          if(ids.length) await Q(SB.from("user_clients").insert(ids.map(user_id=>({user_id,client_id:nc.id}))));
          const off=DATA.gestoes.map(g=>g.id).filter(id=>!fd.getAll("scope").includes(id));
          if(off.length) await Q(SB.from("docs").upsert({client_id:nc.id,collection:"plan",id:"cfg",data:{off}},{onConflict:"client_id,collection,id"}));
          closeModal(); toast("Projeto criado"); await rAdmin();
          openModal("Projeto criado",`<div><b>${esc(nc.name)}</b> já tem o cronograma completo. Próximos passos: cadastre os usuários do cliente (aba Usuários) e abra o projeto para lançar key users, agenda e fichas.</div>`,{extra:`<button type="button" class="btn pri" id="pj-open">Abrir projeto</button>`,onOpen:()=>{ $("#pj-open").onclick=()=>{ store("nw_client",String(nc.id)); location.reload(); }; }}); }
        else { b.active=fd.get("active")==="1"; await upd("clients","id",c.id,b);
          for(const u of USERS.filter(x=>x.active&&x.role==="consultor"&&!x.allClients)){ const cur=u.clientIds.includes(c.id), want=ids.includes(u.id); if(cur!==want) await syncLinks(u.id,want?[c.id]:[],want?[]:[c.id]); }
          closeModal(); toast("Projeto salvo"); await rAdmin(); }
      }catch(e){ toast(e.message); } }});
}
document.addEventListener("click",async(e)=>{
  const b=e.target.closest("[data-ad]"); if(!b) return; const a=b.dataset.ad, id=b.dataset.id;
  if(a==="tab-u"){ adminTab="usuarios"; rAdmin(); }
  else if(a==="tab-c"){ adminTab="clientes"; rAdmin(); }
  else if(a==="u-new") userForm(null);
  else if(a==="u-edit") userForm(USERS.find(u=>u.id===id));
  else if(a==="u-reset"){ const u=USERS.find(x=>x.id===id);
    try{ await Q(SB.auth.resetPasswordForEmail(u.email,{redirectTo:location.origin+location.pathname})); toast("Link para criar nova senha enviado para "+u.email); }catch(er2){ toast(er2.message); } }
  else if(a==="c-new") projectForm(null);
  else if(a==="c-edit") projectForm(CLIENTS.find(c=>String(c.id)===id));
  else if(a==="c-open"){ store("nw_client",String(id)); location.reload(); }
});

/* --- arquivos complementares --- */
let FILES=[];
const FEXT=["pdf","xls","xlsx","xlsm","csv","doc","docx","ppt","pptx","odt","ods","txt","zip","rar","7z","png","jpg","jpeg","gif","mp4"];
const fsize=(n)=>n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1).replace(".",",")+" MB";
const ficon=(n)=>{ const e=(n.split(".").pop()||"").toLowerCase(); const c={pdf:"#b3261e",xls:"#2e7d32",xlsx:"#2e7d32",xlsm:"#2e7d32",csv:"#2e7d32",doc:"#0f6aa8",docx:"#0f6aa8",ppt:"#e65100",pptx:"#e65100"}[e]||"#566574"; return `<span class="fico" style="background:${c}">${esc((e||"?").slice(0,4).toUpperCase())}</span>`; };
const clientUsers=()=>Object.entries(names).filter(([,p])=>p&&p.role==="cliente").map(([id,p])=>({id,name:p.name}));
function visBadge(f){
  if(f.visibility==="team") return '<span class="badge todo">Somente equipe NW</span>';
  if(f.visibility==="all") return '<span class="badge done">Todos do projeto</span>';
  const n=(f.userIds||[]).map(i=>nameOf(i)); return `<span class="badge agendado" title="${esc(n.join(", "))}">${n.length} usuário${n.length===1?"":"s"}</span>`;
}
function visFields(vis,ids){
  const cu=clientUsers();
  return `<div class="f"><span class="lb">Quem pode ver e baixar</span><div class="chk" style="flex-direction:column;gap:6px">
    <label><input type="radio" name="vis" value="team" ${vis==="team"?"checked":""}> Somente a equipe NW (interno)</label>
    <label><input type="radio" name="vis" value="all" ${vis==="all"?"checked":""}> Todos os usuários deste projeto</label>
    <label><input type="radio" name="vis" value="users" ${vis==="users"?"checked":""}> Apenas usuários selecionados</label></div></div>
    <div class="f" data-vu><span class="lb">Usuários do cliente</span><div class="cl-list">${cu.map(u=>`<label><input type="checkbox" name="vusers" value="${esc(u.id)}" ${(ids||[]).includes(u.id)?"checked":""}> ${esc(u.name)}</label>`).join("")||'<span class="hint">Este projeto ainda não tem usuários de cliente. Cadastre em Administração → Usuários.</span>'}</div></div>`;
}
function wireVis(fm){ const sync=()=>{ const v=fm.querySelector("input[name=vis]:checked").value; fm.querySelector("[data-vu]").hidden=v!=="users"; }; fm.querySelectorAll("input[name=vis]").forEach(r=>r.addEventListener("change",sync)); sync(); }
const readVis=(fd)=>({visibility:fd.get("vis"),userIds:fd.getAll("vusers")});
async function loadFiles(){ if(!CID) return; try{ FILES=(await Q(SB.from("files").select("*").eq("client_id",CID).order("uploaded_at",{ascending:false}))).map(f=>({id:f.id,name:f.name,description:f.description,size:Number(f.size),path:f.path,visibility:f.visibility,userIds:f.allowed_users||[],uploadedBy:f.uploaded_by,uploadedAt:f.uploaded_at})); }catch(e){ FILES=[]; } rArquivos(); }
function rArquivos(){
  const el=$("#s-arquivos"); if(!el||MODE!=="api") return;
  const rows=FILES.map(f=>`<tr><td><div class="fcell">${ficon(f.name)}<div><b>${esc(f.name)}</b>${f.description?`<br><span class="hint">${esc(f.description)}</span>`:""}</div></div></td><td class="num">${fsize(f.size)}</td><td>${esc(nameOf(f.uploadedBy))}<br><span class="hint">${fmt(f.uploadedAt)}</span></td>${canWrite?`<td>${visBadge(f)}</td>`:""}<td class="fact"><button class="btn sm pri" data-fa="dl" data-id="${f.id}">Baixar</button>${canWrite?` <button class="btn sm" data-fa="edit" data-id="${f.id}">Editar</button> <button class="btn sm danger" data-fa="del" data-id="${f.id}">Excluir</button>`:""}</td></tr>`).join("");
  el.innerHTML=`<div class="bar-tools"><h2 style="margin:0">Arquivos complementares</h2>${canWrite?`<span class="row-gap"><input type="file" id="fa-in" multiple hidden accept=".${FEXT.join(",.")}"><button class="btn pri" data-fa="pick">+ Enviar arquivos</button></span>`:""}</div>
    ${FILES.length?`<div class="card tbl" style="padding:6px 8px"><table style="min-width:${canWrite?760:640}px"><thead><tr><th>Arquivo</th><th>Tamanho</th><th>Enviado por</th>${canWrite?"<th>Quem vê</th>":""}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${canWrite?"Nenhum arquivo ainda. Envie planilhas modelo, manuais e documentos e escolha quem pode ver (clique em Enviar ou arraste aqui).":"Nenhum arquivo disponível para você no momento."}</div>`}
    ${canWrite?`<div class="hint" style="margin-top:8px">Formatos: PDF, Excel, Word, PowerPoint, CSV, TXT, ZIP, imagens e MP4 · até 20 MB por arquivo e 300 MB por projeto. Cada arquivo só é visto por quem você permitir.</div>`:""}`;
  const inp=$("#fa-in"); if(inp) inp.onchange=()=>{ const l=Array.from(inp.files); inp.value=""; if(l.length) uploadDialog(l); };
}
function uploadDialog(list){
  const ok=list.filter(f=>{ const ext=(f.name.split(".").pop()||"").toLowerCase(); if(!FEXT.includes(ext)){ toast("“"+f.name+"”: tipo de arquivo não permitido."); return false; } if(f.size>20*1024*1024){ toast("“"+f.name+"” passa de 20 MB."); return false; } return true; });
  if(!ok.length) return;
  openModal("Enviar "+(ok.length>1?ok.length+" arquivos":"arquivo"),`<div class="hint">${ok.map(f=>esc(f.name)+" ("+fsize(f.size)+")").join("<br>")}</div>`+F.txt("description","Descrição (opcional)","")+visFields("team",[]),{submit:"Enviar",onOpen:wireVis,
    onSubmit:async(fd)=>{ const v=readVis(fd); if(v.visibility==="users"&&!v.userIds.length){ toast("Selecione ao menos um usuário."); return; } closeModal(); await uploadFiles(ok,(fd.get("description")||"").trim(),v); }});
}
async function uploadFiles(list,description,v){
  let ok=0;
  for(const [i,f] of list.entries()){
    toast("Enviando "+(i+1)+" de "+list.length+": "+f.name+"…");
    const ext=(f.name.split(".").pop()||"").toLowerCase(); const path=CID+"/"+crypto.randomUUID()+"."+ext; let up=false;
    try{
      await Q(SB.storage.from("arquivos").upload(path,f,{contentType:f.type||"application/octet-stream",upsert:false})); up=true;
      await Q(SB.from("files").insert({client_id:CID,name:f.name,description,mime:f.type||"",size:f.size,path,visibility:v.visibility,allowed_users:v.visibility==="users"?v.userIds:[],uploaded_by:ME.id})); ok++;
    }catch(e){ if(up) SB.storage.from("arquivos").remove([path]).then(()=>{},()=>{}); toast("“"+f.name+"”: "+(e.message||"erro ao enviar")); }
  }
  await loadFiles(); if(ok) toast(ok+(ok>1?" arquivos enviados":" arquivo enviado"));
}
function fileEdit(f){
  openModal("Editar arquivo",F.txt("name","Nome do arquivo",f.name,"required")+F.txt("description","Descrição (opcional)",f.description)+visFields(f.visibility||"team",f.userIds||[]),{submit:"Salvar",onOpen:wireVis,onSubmit:async(fd)=>{
    const v=readVis(fd); if(v.visibility==="users"&&!v.userIds.length){ toast("Selecione ao menos um usuário."); return; }
    let nm=(fd.get("name")||"").trim(); const ext=(f.name.split(".").pop()||"").toLowerCase(); if(!nm.toLowerCase().endsWith("."+ext)) nm+="."+ext;
    try{ await upd("files","id",f.id,{name:nm,description:(fd.get("description")||"").trim(),visibility:v.visibility,allowed_users:v.visibility==="users"?v.userIds:[]}); closeModal(); await loadFiles(); toast("Arquivo atualizado"); }catch(e){ toast(e.message); } }});
}
async function downloadFile(f){
  try{ const d=await Q(SB.storage.from("arquivos").createSignedUrl(f.path,120,{download:f.name})); const a=document.createElement("a"); a.href=d.signedUrl; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ toast("Não foi possível baixar: "+e.message); }
}
document.addEventListener("click",async(e)=>{
  const b=e.target.closest("[data-fa]"); if(!b) return; const a=b.dataset.fa, id=Number(b.dataset.id);
  if(a==="pick"){ const i=$("#fa-in"); if(i) i.click(); }
  else if(a==="dl") downloadFile(FILES.find(f=>f.id===id));
  else if(a==="edit") fileEdit(FILES.find(f=>f.id===id));
  else if(a==="del"){ if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Confirmar?"; setTimeout(()=>{ b.dataset.sure=""; b.textContent="Excluir"; },4000); return; }
    const f=FILES.find(x=>x.id===id); try{ await Q(SB.from("files").delete().eq("id",id)); SB.storage.from("arquivos").remove([f.path]).then(()=>{},()=>{}); await loadFiles(); toast("Arquivo excluído"); }catch(er2){ toast(er2.message); } }
});
["dragover","drop"].forEach(t=>document.addEventListener(t,(e)=>{ const z=e.target.closest&&e.target.closest("#s-arquivos"); if(!z||!canWrite) return; e.preventDefault(); if(t==="drop"&&e.dataTransfer&&e.dataTransfer.files.length) uploadDialog(Array.from(e.dataTransfer.files)); }));


boot();
</script>

</body></html>
